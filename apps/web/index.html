<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="keywords" content="md,markdown,markdown-editor,wechat,official-account,yanglbme,doocs" />
    <meta name="description" content="Wechat Markdown Editor | 一款高度简洁的微信 Markdown 编辑器" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Markdown 编辑器 | Doocs</title>
    <link rel="shortcut icon" href="/favicon.png" />
    <link rel="apple-touch-icon-precomposed" href="/favicon.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
    </style>
    <script>
      ;(function () {
        const LOCALE_KEY = 'locale'

        function normalizeLocale(value) {
          if (value === 'zh-CN' || value === 'zh-TW' || value === 'en-US' || value === 'ja-JP') return value
          if (typeof value === 'string') {
            const lower = value.toLowerCase()
            if (lower === 'zh-tw' || lower === 'zh-hk' || lower === 'zh-mo' || lower.startsWith('zh-hant'))
              return 'zh-TW'
            if (lower.startsWith('zh')) return 'zh-CN'
            if (lower.startsWith('ja')) return 'ja-JP'
            if (lower.startsWith('en')) return 'en-US'
          }
          return null
        }

        function detectFromNavigator() {
          const languages = navigator.languages?.length ? navigator.languages : [navigator.language]
          for (const language of languages) {
            const normalized = normalizeLocale(language)
            if (normalized) return normalized
          }
          return 'zh-CN'
        }

        function readLocaleFromLocalStorage() {
          try {
            return normalizeLocale(localStorage.getItem(LOCALE_KEY))
          } catch {
            return null
          }
        }

        window.__MD_BOOT_LOCALE__ = readLocaleFromLocalStorage() || detectFromNavigator()

        const theme = localStorage.getItem('vueuse-color-scheme') ?? 'auto'
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        if (theme === 'dark' || (theme === 'auto' && prefersDark)) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>

  <body>
    <noscript>
      <strong>Please enable JavaScript to continue.</strong>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/sidepanel.ts"></script>
  </body>
</html>
